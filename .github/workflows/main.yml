name: Windows VM - Tailscale
on:
  workflow_dispatch:

jobs:
  vm:
    runs-on: windows-latest
    timeout-minutes: 360

    steps:
      - name: Configurar RDP e Firewall
        run: |
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0 -Force
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "UserAuthentication" -Value 0 -Force
          Enable-NetFirewallRule -Name "RemoteDesktop-UserMode-In-TCP"
          net user RunnerUser Senha123! /add
          net localgroup Administrators RunnerUser /add

      - name: Instalar Tailscale
        run: |
          $installerUrl = "https://pkgs.tailscale.com/stable/tailscale-setup-latest-amd64.msi"
          $installerPath = "$env:TEMP\tailscale.msi"
          Invoke-WebRequest -Uri $installerUrl -OutFile $installerPath
          Start-Process msiexec.exe -ArgumentList "/i", "`"$installerPath`"", "/quiet", "/norestart" -Wait
          Remove-Item $installerPath -Force

      - name: Conectar e pegar IP
        env:
          TAILSCALE_AUTH_KEY: ${{ secrets.TAILSCALE_AUTH_KEY }}
        run: |
          & "$env:ProgramFiles\Tailscale\tailscale.exe" up --authkey=$env:TAILSCALE_AUTH_KEY --hostname=gh-vm-$env:GITHUB_RUN_ID
          Start-Sleep -Seconds 15
          $ip = & "$env:ProgramFiles\Tailscale\tailscale.exe" ip -4
          echo "=================================================="
          echo "IP DA MAQUINA: $ip"
          echo "USUARIO: RunnerUser"
          echo "SENHA: Senha123!"
          echo "=================================================="
          echo "ABRA O TAILSCALE NO SEU CELULAR/PC E CONECTE!"
          echo "=================================================="
          while($true) { Start-Sleep -Seconds 60 }
        timeout-minutes: 360
        
